[package]
name = "vigil-core"
description = "The VIGIL runtime decision engine: the enforcement pipeline, risk engine, session state and decision API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vigil-audit = { workspace = true }
vigil-capability = { workspace = true }
vigil-common = { workspace = true }
vigil-detect = { workspace = true }
vigil-identity = { workspace = true }
vigil-policy = { workspace = true }
vigil-protocol = { workspace = true }
vigil-remit = { workspace = true }
vigil-trace = { workspace = true }

async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
vigil-audit = { workspace = true }
criterion = { workspace = true }
async-trait = { workspace = true }
vigil-gateway = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[[bench]]
name = "decision_pipeline"
harness = false
