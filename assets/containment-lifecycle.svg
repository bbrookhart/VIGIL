<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Incident containment lifecycle</title><desc id="desc">Risk signals aggregate into an incident; containment revokes capabilities, restricts mutations, optionally terminates identity-confirmed processes, and preserves evidence.</desc>
  <defs><style>.bg{fill:#f8fafc}.c{fill:#fff;stroke:#cbd5e1;stroke-width:2}.risk{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.v{fill:#102a43}.t{font:600 19px Arial;fill:#102a43}.s{font:14px Arial;fill:#475569}.w{font:600 19px Arial;fill:#fff}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="420" rx="24"/><text class="t" x="55" y="60">Containment subtracts authority and keeps the evidence</text>
  <rect class="c" x="45" y="130" width="180" height="120" rx="14"/><text class="t" x="72" y="167">Signals</text><text class="s" x="72" y="198">risk · sequences</text><text class="s" x="72" y="220">reconciliation</text>
  <rect class="risk" x="275" y="130" width="180" height="120" rx="14"/><text class="t" x="302" y="167">Incident</text><text class="s" x="302" y="198">durable state +</text><text class="s" x="302" y="220">response plan</text>
  <rect class="v" x="505" y="105" width="220" height="170" rx="14"/><text class="w" x="548" y="147">Contain</text><text class="s" style="fill:#dbeafe" x="540" y="181">revoke capabilities</text><text class="s" style="fill:#dbeafe" x="540" y="205">withhold mutation</text><text class="s" style="fill:#fbbf24" x="540" y="229">identity-safe stop</text><text class="s" style="fill:#dbeafe" x="540" y="253">optional session seal</text>
  <rect class="c" x="775" y="130" width="180" height="120" rx="14"/><text class="t" x="802" y="167">Persist</text><text class="s" x="802" y="198">workspace risk</text><text class="s" x="802" y="220">survives churn</text>
  <rect class="c" x="1005" y="130" width="150" height="120" rx="14"/><text class="t" x="1033" y="167">Verify</text><text class="s" x="1033" y="198">audit chain +</text><text class="s" x="1033" y="220">rollback limits</text>
  <path class="a" d="M225 190H267"/><path class="a" d="M455 190H497"/><path class="a" d="M725 190H767"/><path class="a" d="M955 190H997"/>
  <text class="s" x="55" y="340">Containment is not a claim that direct, previously unobserved host changes can be undone.</text>
</svg>
